name: Mantrakshata Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Typecheck and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript Sources
        run: npx tsc --noEmit

      - name: Execute Server Security & Business Logic Tests
        run: npm test

      - name: Execute Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Standalone Deployment and Worker
        run: npm run test:deployment

      - name: Verify Public Pages Without Backend Configuration
        run: node scripts/test-standalone.mjs --without-backend
